# Add modules and resource links as their materials become available.
- title: "Module 1: Location, Cities, and Agglomeration"
  dirname: modules/01-location
  desc: "Why cities form, how firms choose locations, and how scale economies, transport costs, and agglomeration shape regional activity. Read the textbook selections after the first class."
  readings:
    Required reading:
      - source: hoover-giarratani
        selection: "§§1.1–1.3 and 2.3–2.7."
      - source: brueckner
        selection: "Ch. 1, §§1.1–1.5."
      - source: world-bank
        selection: "Ch. 2, “Economic Clusters and Corridor Development,” discussion of figures 2.13–2.15 (PS 1, Problem 1)."
    Supplemental reading:
      - source: hoover-giarratani
        selection: "Ch. 5, §§5.2–5.4 (external economies)."
      - source: brueckner
        selection: "§1.6 (retail clustering)."
    Optional reading:
      - source: glaeser-gottlieb
        selection: "§3 (evidence on agglomeration)."
      - source: world-bank
        selection: "Ch. 4, figure 4.1 (economic activity around Hanoi and Ho Chi Minh City)."
  materials:
    - title: "Course introduction slides"
      url: ../00-course-introduction/slides.html
    - title: "Lecture slides"
      url: slides.html
    - title: "Student reader (web)"
      url: reader.html
    - title: "Student reader (PDF)"
      url: reader.pdf
    - title: "World Bank, Vietnam Development Report 2019, ch. 2, figures 2.13–2.15 (required for PS 1, Problem 1)"
      url: "https://documents1.worldbank.org/curated/en/590451578409008253/pdf/Vietnam-Development-Report-2019-Connecting-Vietnam-for-Growth-and-Shared-Prosperity.pdf#page=65"

- title: "Module 2: Regional Growth and Interregional Connections"
  dirname: modules/02-growth
  desc: "Regional growth, productivity, structural change, trade, migration, and convergence. Includes synthetic regional comparisons, income-feedback calculations, and a transport-corridor example."
  readings:
    Required reading:
      - source: hoover-giarratani
        selection: "§11.2 (Nov 25) and §§11.5–11.6 (interregional connections and convergence)."
    Supplemental reading:
      - source: hoover-giarratani
        selection: "§§11.1 and 11.3–11.4 (growth trends, demand, and supply), and §10.3 (migration)."
    Optional reading:
      - source: hoover-giarratani
        selection: "§11.7 (cities and regional development)."
  materials:
    - title: "Lecture slides"
      url: slides.html
    - title: "Student reader (web)"
      url: reader.html
    - title: "Student reader (PDF)"
      url: reader.pdf

- title: "Module 3: Defining and Measuring a Regional Economy"
  dirname: modules/03-measurement
  readings:
    Required reading:
      - source: schaffer
        selection: "For Nov 26, read ch. 2, “What Is a Region?” (main text, printed pp. 6–9), and ch. 3, Note A, “Techniques for Data Analysis” (printed pp. 43–47, on location quotients and shift-share)."
    Supplemental reading:
      - source: schaffer
        selection: "Use the full ch. 3 (printed pp. 13–47) as a reference. For the link to Module 2, see pp. 19–21 on using location quotients to estimate export employment and the assumptions that estimate requires."
      - source: hoover-giarratani
        selection: "§§9.1–9.4 and appendix 12-1 (functional regions and specialization)."
  materials:
    - title: "Lecture slides"
      url: slides.html
    - title: "The seafood order: in-class handout (PDF)"
      url: seafood-order.pdf
    - title: "Cần Thơ sector mix, LQs, and shift-share (Excel exercise and data)"
      url: can-tho-sector-data.xlsx
    - title: "Worked examples reader (web)"
      url: reader.html
    - title: "Worked examples reader (PDF)"
      url: reader.pdf

- title: "Module 4: Spatial Equilibrium and Migration"
  dirname: modules/04-spatial-equilibrium
  desc: "November 27 covers bid rent and the Rosen–Roback wage–rent diagram, with a River and Harbor numerical example in R if time permits. November 30 uses market clearing to calculate migration."
  readings:
    Required reading:
      - source: brueckner
        selection: "Ch. 2, §§2.1–2.4 (commuting and household location), and §11.2, pp. 233–241 (the Roback model). Figures 11.1 and 11.2 correspond to the reader’s worker and firm curves on pp. 4–7."
    Supplemental reading:
      - source: morten-spatial-equilibrium
        selection: "PDF pp. 6–16 and 21–25 (location preferences, migration, and market clearing)."
    Optional reading:
      - source: roback-1982
        selection: "pp. 1259–1262, especially Figure 1 (how amenities affect wages and land rents)."
  materials:
    - title: "Lecture slides"
      url: slides.html
    - title: "Rosen–Roback model reader (web)"
      url: reader.html
    - title: "Rosen–Roback model reader (PDF)"
      url: reader.pdf
    - title: "River and Harbor numerical exercise (R script)"
      url: R/river-harbor.R

- title: "Module 5: Housing, Land Use, and Hedonics"
  dirname: modules/05-hedonics
  desc: "Use rents and commuting distance to study job access, housing supply, and land use. Estimate how airport noise shows up in house prices."
  readings:
    Required reading:
      - source: brueckner
        selection: "Ch. 2, §§2.5–2.8 (housing supply and urban land use), and §6.2 (hedonic housing prices)."
      - source: hall-lawson-shia
        selection: "Ch. 5 (airport noise and house prices)."
    Supplemental reading:
      - source: hoover-giarratani
        selection: "§§6.2–6.7 and §7.3 (rent gradients and residential location)."
    Optional reading:
      - source: hall-lawson-shia
        selection: "Chs. 7–8 (water quality, lake amenities, and industrial disamenities)."

- title: "Module 6: Input-Output Analysis and Regional Linkages"
  dirname: modules/06-input-output
  readings:
    Required reading:
      - source: schaffer
        selection: "Chs. 4–5 (accounts and model solution) and ch. 6 (multipliers)."
      - source: hewings
        selection: "§4.1 (impact analysis)."
    Supplemental reading:
      - source: schaffer
        selection: "Ch. 6 multiplier appendix."

- title: "Module 7: Regional CGE Modeling and Model Comparison"
  dirname: modules/07-cge
  readings:
    Required reading:
      - source: hewings
        selection: "§7.2 (social accounting)."
    Supplemental reading:
      - source: hewings
        selection: "§7.4 (labor-market links)."

- title: "Module 8: Integrated Regional Application and Policy Evaluation"
  dirname: modules/08-policy
  readings:
    Required reading:
      - source: hoover-giarratani
        selection: "§12.2 (regional policy objectives)."
    Supplemental reading:
      - source: hoover-giarratani
        selection: "§12.5 (regional development strategy)."
