project:
  type: default
  render:
    - problem-set-*.qmd

format:
  pdf:
    pdf-engine: xelatex
    documentclass: article
    papersize: letter
    fontsize: 11pt
    geometry:
      - margin=1in
      - headheight=14pt
      - headsep=18pt
    include-in-header:
      text: |
        \usepackage{fancyhdr}
        \makeatletter
        \renewcommand{\@maketitle}{%
          \begingroup
          \centering
          \let\footnote\thanks
          {\LARGE\@title\par}%
          \ifx\@author\@empty\else\smallskip\@author\par\fi
          \ifx\@date\@empty\else\smallskip\@date\par\fi
          \endgroup
          \medskip
        }
        \makeatother
        \fancypagestyle{problemset}{
          \fancyhf{}
          \fancyhead[L]{\footnotesize ECON 463 \enspace\textbar\enspace Regional Economics}
          \fancyhead[R]{\footnotesize\textbf{Name}\enspace\rule{2.75in}{0.4pt}}
          \fancyfoot[C]{\footnotesize\thepage}
          \renewcommand{\headrulewidth}{0.4pt}
        }
        \AtBeginDocument{\pagestyle{problemset}}
        \fancypagestyle{plain}[problemset]{}
        \newcommand{\answerspace}[1][1.5in]{\par\vspace*{#1 plus 1fill}}
    include-before-body:
      text: |
        \noindent Write your answers by hand. Show your work, explain your reasoning,
        and label any graphs.\par
